{% extends 'myapp/base.html' %}

{% block body %}
<div class="flex gap-10 p-10">
    <div class="w-1/3 shrink-0">
         <img class="w-full h-64 object-contain" src="https://motobros.com/wp-content/uploads/2024/09/no-image.jpeg" alt="">
    </div>
    <div>
         <div class="text-4xl mb-4">{{ product.name }}</div>
         <div class="mb-4">{{ product.description }}</div>
         <div class="mb-4 text-green-700 font-bold"> ${{ product.price }}</div>
         <div>
          <button id="checkout-button" class="bg-green-500 text-white px-4 py-2 rounded-sm">Buy</button>
         </div>
         <div id="myemail" hidden>
             {{request.user.email}}
         </div>
    </div>
</div>
<script type="text/javascript">
var checkoutButton=document.getElementById('checkout-button')
checkoutButton.addEventListener('click',function(){
console.log('Button Clicked')
var email=document.getElementById("myemail").innerText.trim()
if (email.length==0){
   alert("please enter your email address")
   return
}

fetch("{% url 'api_checkout_session' id=product.id %}",{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({'email': email})


}).then (function(response){
     return response.json()
}).then (function(session){
     if(!session.url){
          alert('Could not start checkout')
          return
     }
     window.location.href=session.url
}).catch(function(error){
     console.error('Error:',error)
})
})


</script>


{% endblock %}
